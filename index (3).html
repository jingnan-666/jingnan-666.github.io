<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你最喜欢的景观类型</title>
<style>
    /* 1. 重置默认样式 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* 2. 整体背景设计：清新自然的渐变色 */
    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        /* 添加一点动态光效 */
        background-size: 200% 200%;
        animation: gradientBG 15s ease infinite;
        padding: 20px;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* 3. 卡片容器设计 */
    .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 30px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 
                    0 1px 3px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 420px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    }

    /* 4. 标题样式 */
    h2 {
        color: #2c3e50;
        font-size: 24px;
        text-align: center;
        margin-bottom: 30px;
        position: relative;
    }

    /* 标题下方的装饰线 */
    h2::after {
        content: '';
        display: block;
        width: 40px;
        height: 4px;
        background: #43e97b;
        border-radius: 2px;
        margin: 10px auto 0;
    }

    /* 5. 选项样式（隐藏原生单选框，美化整个选项块） */
    .option-group {
        display: flex;
        flex-direction: column;
        gap: 15px; /* 选项之间的间距 */
        margin-bottom: 30px;
    }

    .option {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        background: #f8f9fa;
        border: 2px solid transparent;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
    }

    /* 隐藏默认的radio圆点 */
    .option input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        border: 2px solid #ccc;
        border-radius: 50%;
        margin-right: 15px;
        outline: none;
        transition: all 0.3s ease;
        position: relative;
        background: #fff;
    }

    /* 鼠标悬停时的效果 */
    .option:hover {
        background: #eef1f5;
        transform: translateX(5px);
    }

    /* 选中状态：输入框和整个卡片的高亮 */
    .option input[type="radio"]:checked {
        border-color: #43e97b;
        background: #fff;
    }

    /* 自定义选中点 */
    .option input[type="radio"]:checked::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 12px;
        background: #43e97b;
        border-radius: 50%;
        animation: pop 0.3s ease;
    }

    /* 选中卡片时的背景变色 */
    .option input[type="radio"]:checked ~ span {
        color: #38f9d7;
        font-weight: bold;
    }

    .option:has(input[type="radio"]:checked) {
        background: rgba(67, 233, 123, 0.1);
        border-color: #43e97b;
    }

    /* 选中动画 */
    @keyframes pop {
        0% { transform: translate(-50%, -50%) scale(0); }
        80% { transform: translate(-50%, -50%) scale(1.2); }
        100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* 6. 按钮样式 */
    button {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(67, 233, 123, 0.4);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(67, 233, 123, 0.6);
    }

    button:active {
        transform: translateY(1px);
        box-shadow: 0 2px 10px rgba(67, 233, 123, 0.4);
    }

    /* 内部的文字标签 */
    .option span {
        font-size: 16px;
        color: #555;
        transition: color 0.3s;
    }
</style>
</head>
<body>

    <div class="card">
        <h2>你最喜欢的景观类型</h2>
        
        <form>
            <div class="option-group">
                <!-- 选项 A -->
                <label class="option">
                    <input type="radio" name="q" value="森林">
                    <span>A 森林</span>
                </label>
                
                <!-- 选项 B -->
                <label class="option">
                    <input type="radio" name="q" value="海洋">
                    <span>B 海洋</span>
                </label>
                
                <!-- 选项 C -->
                <label class="option">
                    <input type="radio" name="q" value="沙漠">
                    <span>C 沙漠</span>
                </label>
            </div>
            
            <!-- 按钮保留了原有的 JS 逻辑，但增加了防误触体验 -->
            <button type="button"
              onclick="const v=document.querySelector('input[name=q]:checked'); alert(v ? '你选择了：'+v.value : '请先选择一个选项')">
              提 交
            </button>
        </form>
    </div>

</body>
</html>
