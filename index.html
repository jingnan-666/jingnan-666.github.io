<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>景观类型选择题</title>
<body>
  <h2>你最喜欢的景观类型</h2>
  <form>
    <label><input type="radio" name="q" value="森林"> A 森林</label><br>
    <label><input type="radio" name="q" value="海洋"> B 海洋</label><br>
    <label><input type="radio" name="q" value="沙漠"> C 沙漠</label><br><br>
    <button type="button"
      onclick="const v=document.querySelector('input[name=q]:checked'); alert(v ? '你选择了：'+v.value : '请先选择一个选项')">
      提交
    </button>
  </form>
</body>
</html>
